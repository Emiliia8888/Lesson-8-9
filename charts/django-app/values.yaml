image:
  repository: "034255117140.dkr.ecr.eu-central-1.amazonaws.com/django-app"
  tag: "latest"
  pullPolicy: Always

replicaCount: 1

containerPort: 8000

django:
  secretKey: "change-me-production-secret"
  debug: "True"
  allowedHosts: "*"

db:
  host: "dev-django-db-rds.ctskymysi6zv.eu-central-1.rds.amazonaws.com"
  port: "5432"
  name: "postgres"
  user: "postgres"
  password: "change-me-db-password"

hpa:
  enabled: true
  minReplicas: 1
  maxReplicas: 3
  targetCPUUtilizationPercentage: 80

service:
  type: ClusterIP
  port: 80
  targetPort: 8000